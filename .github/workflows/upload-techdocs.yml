name: Upload Techdocs 📄
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
concurrency: techdocs-${{ github.ref}}-${{ github.event_name }}
jobs:
  build-and-upload:
    runs-on: [self-hosted, i-build-prod]
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        name: git checkout
      - uses: soundcloud/sc-github-actions/publish-techdocs@publish-techdocs-v1.2.1
        name: upload docs
