# Automated review of every non-draft pull request, built from the actions-toolkit
# `ai-pr-review` reusable workflow with Anthropic's /code-review plugin, so findings land
# as inline comments on the lines they concern.
#
# Cost levers (see the toolkit header for the full list):
#   - `synchronize` is deliberately not a trigger: a review runs once when a PR opens, is
#     reopened, or leaves draft. Re-trigger by closing and reopening, or @claude the PR.
#   - Docs-only and lockfile-only changes are not reviewed.
#   - Dependabot, fork and draft PRs are skipped inside the reusable workflow.
#   - The job gates on the CLAUDE_REVIEWS repository variable so a fresh clone stays
#     green without a CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret.

name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'go.sum'
      - '**/.terraform.lock.hcl'

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.CLAUDE_REVIEWS == 'true'
    uses: octamagic/actions-toolkit/.github/workflows/ai-pr-review.yml@v0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    with:
      provider: claude
      use-code-review-plugin: true
      conventions-file: CLAUDE.md
      focus: |
        Treat the Boundaries section of CLAUDE.md as hard constraints. Flag any change
        that lets minor protection fail open, compares error strings, adds package-level
        state, touches internal/generated by hand, or commits anything account-specific.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
