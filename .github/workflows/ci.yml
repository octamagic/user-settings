# Continuous integration, built from github.com/octamagic/actions-toolkit.
#
#   go           gofmt, go vet, golangci-lint, unit tests with -race, cross-compile
#   generated    protobuf/Twirp/mock output in internal/generated matches the sources
#   integration  repository tests against DynamoDB Local, e2e via testcontainers
#   image        the container image builds and is scanned (not pushed on CI)

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    uses: octamagic/actions-toolkit/.github/workflows/go-ci.yml@v0
    with:
      golangci-lint-version: v2.1
      # Unit packages only; the suites under tests/ need Docker and run in `integration`.
      test-command: go test -race -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v -e /generated -e /tests/)
      coverage: false
      build-targets: '["linux/amd64","linux/arm64"]'
      build-command: go build ./cmd/api

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: octamagic/actions-toolkit/actions/setup-go@v0
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: make tools
      - run: make generate
      - name: Fail if generate changed anything
        run: git diff --exit-code -- . ':(exclude)go.sum'

  integration:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: octamagic/actions-toolkit/actions/setup-go@v0
      - name: Start DynamoDB Local
        run: docker compose -f docker-compose.ci.yml up -d --quiet-pull --wait --wait-timeout 60
      - run: make test-integration
      - run: make test-e2e
      - if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

  image:
    name: Container image
    uses: octamagic/actions-toolkit/.github/workflows/docker-build.yml@v0
    with:
      registry: ghcr
      push: false
      scan: true
    permissions:
      contents: read
      packages: write
      id-token: write
