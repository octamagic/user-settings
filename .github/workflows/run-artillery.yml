name: Run Artillery 🔫🔫🔫
on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: 'The AWS account ID to use for the test'
        type: choice
        required: true
        default: '981069094484' # stage
        options:
          - '045673982243' # dev
          - '981069094484' # stage
          - '062107869946' # prod
      environment:
        description: 'The environment to run against'
        type: choice
        required: true
        default: staging
        options:
          - development
          - staging
          - production
      script:
        description: "The name of the artillery script to run - e.g. 'basic.yml'"
        required: true
        default: 'basic.yml'
      runners:
        description: 'The number of runners to distribute the test across'
        required: false
        default: '2'
      note:
        description: 'Attach a note to a test, for example: "This is a spike test for the payments subgraph". Please don''t use double quotes.'
        required: false
        default: ''
      use_spot:
        description: 'Run on fargate spot?'
        type: choice
        required: true
        default: 'false'
        options:
          - 'true'
          - 'false'
jobs:
  artillery:
    runs-on: [self-hosted, i-build-prod]
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for checking stuff out
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        name: checkout
      - uses: soundcloud/sc-github-actions/artillery@master
        name: artillery
        with:
          aws_account_id: ${{ github.event.inputs.aws_account_id }}
          environment: ${{ github.event.inputs.environment }}
          workspace: artillery
          script: ${{ github.event.inputs.script }}
          runners: ${{ github.event.inputs.runners }}
          note: ${{ github.event.inputs.note }}
          use_spot: ${{ github.event.inputs.use_spot }}
          notification_channel: deploys
          artillery_cloud_key: ${{ secrets.SC_ARTILLERY_KEY }}
          