name: "[App] Build & Test PR"
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'services/app/**'
concurrency: pr-app-${{ github.event.pull_request.head.ref}}
jobs:
  build-and-test:
    uses: ./.github/workflows/app-build-test-common.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      commit: ${{ github.event.pull_request.head.sha }}
  deploy-dev:
    runs-on: [self-hosted, i-build-prod]
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - name: deploy development
        env:
          GH_TOKEN: ${{ secrets.SC_GITHUB_BOT_PAT }}
        shell: bash
        run: |
          gh api --method POST /repos/${{ github.repository }}/deployments \
          -f task=deploy:app \
          -f ref=${{ github.event.pull_request.head.sha }} \
          -f environment=development \
          -f description="Deploy api / worker to development" \
          -F production_environment=false \
          -F auto_merge=false \
          -f required_contexts[]="build-and-test / docker-publish (user-settings, services/app/Dockerfile)" \
  auto-approve:
    runs-on: [self-hosted, i-build-prod]
    needs: deploy-dev
    if: ${{ github.actor == 'dependabot[bot]' }}
    timeout-minutes: 5
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: approve-dependabot
        if: github.actor == 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SC_GITHUB_BOT_PAT }}
        run: |
          gh pr review --approve || true
          gh pr merge --auto --rebase || true