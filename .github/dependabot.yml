version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    assignees:
      - "sc-github-bot"
    schedule:
      interval: daily
      timezone: Europe/Berlin
      time: "08:00"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "sc-github-bot"
    schedule:
      interval: daily
      timezone: Europe/Berlin
      time: "08:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: soundcloud/sc-github-actions
  - package-ecosystem: terraform
    directory: "/terraform"
    schedule:
      interval: daily
      timezone: Europe/Berlin
      time: "07:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily
      timezone: Europe/Berlin
      time: "07:00"
