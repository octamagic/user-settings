version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - testifylint
    - unparam
  exclusions:
    generated: lax
    paths:
      - internal/generated
    rules:
      - path: '_test\.go'
        linters: [revive, unparam]
      - path: 'mock_.*\.go'
        linters: [revive]
      - linters: [revive]
        text: 'exported .* should have comment'
      - linters: [revive]
        text: 'package-comments:'

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/generated
